name: Build PCF solution

on:
  workflow_dispatch:
    inputs:
      clipboard_read:
        description: "Allow the iframe to read from the clipboard"
        required: true
        type: boolean
        default: true
      clipboard_write:
        description: "Allow the iframe to write to the clipboard"
        required: true
        type: boolean
        default: false
      permission_origin:
        description: "Origin to scope the iframe clipboard permissions to"
        required: false
        type: choice
        default: iframe
        options:
          - iframe
          - https://cesargarcia-cdcr.github.io

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iframe permission config
        env:
          PCF_CLIPBOARD_READ: ${{ inputs.clipboard_read }}
          PCF_CLIPBOARD_WRITE: ${{ inputs.clipboard_write }}
          PCF_PERMISSION_ORIGIN: ${{ inputs.permission_origin }}
        run: node scripts/write-permission-config.mjs

      - name: Refresh PCF types
        run: npm run refreshTypes

      - name: Build PCF control
        run: npm run build

      - name: Package build artifact
        run: |
          mkdir -p artifacts
          zip -rq "artifacts/pcf-clipboard-${{ inputs.clipboard_read }}-${{ inputs.clipboard_write }}.zip" out/controls

      - name: Upload PCF ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pcf-clipboard-${{ inputs.clipboard_read }}-${{ inputs.clipboard_write }}
          path: artifacts/pcf-clipboard-${{ inputs.clipboard_read }}-${{ inputs.clipboard_write }}.zip
          if-no-files-found: error
