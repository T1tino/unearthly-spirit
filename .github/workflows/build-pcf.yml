name: Build PCF

on:
  push:
    branches:
      - main
      - clipboard-write
  pull_request:
    branches:
      - main
      - clipboard-write
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: pcf-control
          path: out/controls/
          if-no-files-found: error
          retention-days: 14
